<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>localhost:3001</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">

    <h1>Willkommen beim at0mic Frontend! 🚀</h1>
    
    <button id="btn-login" style="padding: 10px; font-size: 16px;">Mit Auth0 Einloggen</button>
    <button id="btn-logout" style="padding: 10px; font-size: 16px; display: none;">Ausloggen</button>
    <button id="btn-api" style="padding: 10px; font-size: 16px; display: none;">Geheime Daten laden</button>

    <h3 id="user-info" style="color: green;"></h3>

    <!-- Unser AST Playground Block (anfangs versteckt) -->
<!-- Unser Objekt Manager Block -->
    <div id="object-manager" style="display: none; margin-top: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 8px;">
        <h3>Objekt Manager 🗂️</h3>
        
        <!-- Auswahl: Was wollen wir tun? -->
        <div style="margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 4px;">
            <label style="margin-right: 15px; cursor: pointer;">
                <input type="radio" name="creationType" value="root" checked> 🟢 Neue Root-Domain
            </label>
            <label style="cursor: pointer;">
                <input type="radio" name="creationType" value="hook"> 🔗 An bestehendes Objekt anhängen
            </label>
        </div>

        <!-- FORM 1: Root Domain -->
        <div id="form-root">
            <label style="font-weight: bold;">Neue Domain:</label><br>
            <input type="text" id="new-domain-input" style="width: 100%; max-width: 500px; padding: 8px; margin-bottom: 10px; border-radius: 4px;" placeholder="z.B. dev/admin/user">
            <br>
            <button id="btn-create-domain" style="padding: 10px; font-size: 16px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px;">Domain erstellen</button>
        </div>

        <!-- FORM 2: Hook (Abhängiges Objekt) -->
        <div id="form-hook" style="display: none;">
            <label style="font-weight: bold;">Ziel-Objekt auswählen:</label><br>
            <select id="parent-object-dropdown" style="width: 100%; max-width: 500px; padding: 8px; margin-bottom: 10px; border-radius: 4px; font-size: 16px;">
                <option value="">-- Lade Objekte... --</option>
            </select>
            <br>
            
            <!-- Der Path-Selektor (für später vorbereitet!) -->
            <label style="font-weight: bold;">An welchem Schritt (Path) einhaken?</label><br>
            <select id="path-selector-dropdown" style="width: 100%; max-width: 500px; padding: 8px; margin-bottom: 10px; border-radius: 4px; font-size: 16px;">
                <option value="">Wähle zuerst ein Ziel-Objekt...</option>
            </select>
            <br>

            <button id="btn-create-hook" style="padding: 10px; font-size: 16px; background: #17a2b8; color: white; border: none; cursor: pointer; border-radius: 4px;">Als Ast anhängen</button>
        </div>
        
        <hr style="margin: 20px 0;">

        <!-- Anzeige aller Objekte -->
        <label style="font-weight: bold;">Vorhandene Objekte ansehen:</label><br>
        <select id="object-dropdown" style="width: 100%; max-width: 500px; padding: 8px; margin-bottom: 10px; border-radius: 4px; font-size: 16px;">
            <option value="">-- Objekte werden geladen... --</option>
        </select>
        <button id="btn-reload-objects" style="padding: 10px; font-size: 16px; background: #6c757d; color: white; border: none; cursor: pointer; border-radius: 4px; margin-left: 10px;">🔄 Reload</button>
        
        <pre id="object-details" style="background: #e9ecef; padding: 10px; display: none; margin-top: 15px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word;"></pre>
    </div>




<!-- NEU: AST Generator V2 (Smart) -->
    <div id="ast-playground-v2" style="display: none; margin-top: 20px; border: 1px solid #ff9900; padding: 15px; border-radius: 8px; background: #fffdfa;">
        <h3 style="color: #ff9900;">AST Generator V2 (Smart Select) 🧠</h3>
        
        <label style="font-weight: bold;">Ziel-Objekt auswählen (Root oder Hook):</label><br>
        <select id="ast-v2-object-dropdown" style="width: 100%; max-width: 500px; padding: 8px; margin-bottom: 10px; border-radius: 4px; font-size: 16px;">
            <option value="">-- Objekte werden geladen... --</option>
        </select>
        <br>

        <label style="font-weight: bold;">Code Typ:</label><br>
        <select id="ast-v2-type" style="padding: 8px; margin-bottom: 10px; border-radius: 4px; font-size: 16px; width: 100%; max-width: 500px;">
            <option value="javascript">JavaScript</option>
            <option value="ssf">Server Side Functions (SSF)</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="syntax">Syntax (JSON)</option>
            <option value="data">Data (JSON)</option>
        </select>
        <br>

        <textarea id="ast-v2-code" rows="5" style="width: 100%; max-width: 500px; font-family: monospace; padding: 8px;" placeholder="Code zum Parsen hier eingeben..."></textarea>
        <br>
        
        <button id="btn-parse-v2" style="padding: 10px; font-size: 16px; margin-top: 10px; background: #ff9900; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold;">AST injizieren!</button>
    </div>





    <div id="ast-playground" style="display: none; margin-top: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 8px;">
        <h3>AST Generator Playground 🛠️ (alt)</h3>
        
        <!-- Input für Target Object -->
        <label style="font-weight: bold;">Target Object:</label><br>
        <input type="text" id="target-object" style="width: 100%; max-width: 500px; padding: 8px; margin-bottom: 10px; border-radius: 4px;" placeholder="z.B. dev/admin/user/test">
        <br>
        
        <!-- Input für Current Object -->
        <label style="font-weight: bold;">Current Object:</label><br>
        <input type="text" id="current-object" style="width: 100%; max-width: 500px; padding: 8px; margin-bottom: 15px; border-radius: 4px;" placeholder="z.B. dev/admin/user">
        <br>

        <!-- Das Dropdown Menü -->
        <select id="code-type" style="padding: 8px; margin-bottom: 10px; border-radius: 4px; font-size: 16px;">
            <option value="javascript">JavaScript</option>
            <option value="ssf">Server Side Functions (SSF)</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="syntax">Syntax (JSON)</option>
            <option value="data">Data (JSON)</option>
        </select>
        <br>

        <textarea id="code-input" rows="5" style="width: 100%; max-width: 500px; font-family: monospace; padding: 8px;" placeholder="Gib hier deinen Code ein... z.B. const x = 42;"></textarea>
        <br>
        
        <button id="btn-parse" style="padding: 10px; font-size: 16px; margin-top: 10px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px;">Code evaluieren & umwandeln!</button>
    </div>

    <pre id="api-result" style="background: #eee; padding: 10px; display: none; margin-top: 20px; white-space: pre-wrap; word-wrap: break-word;"></pre>

    <script src="app.js"></script>
</body>
</html>
