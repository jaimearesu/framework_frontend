<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>at0mic Cockpit</title>
        <meta
            name="description"
            content="Cockpit für at0mic – Objekte, SSF, Daten, Rechte und Tresor ansehen und testen."
        />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='4' fill='%236d5dfc'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5.5' fill='none' stroke='%236d5dfc' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5.5' fill='none' stroke='%236d5dfc' stroke-width='2' transform='rotate(60 16 16)'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5.5' fill='none' stroke='%236d5dfc' stroke-width='2' transform='rotate(-60 16 16)'/%3E%3C/svg%3E"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/css/app.css" />
        <link rel="stylesheet" href="/css/pages.css" />
        <!-- Theme so früh wie möglich setzen, damit die Seite nicht kurz hell aufblitzt -->
        <script>
            try {
                // gespeichert wird als JSON (siehe js/core/storage.js), also z.B. "dark" mit Anführungszeichen
                const t = JSON.parse(localStorage.getItem('at0mic.theme'));
                if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
            } catch {
                /* ohne Speicher einfach automatisch */
            }
        </script>
    </head>
    <body>
        <!--
            AUFBAU DES COCKPITS
            ┌──────────┬───────────────────────────────────────┐
            │ Sidebar  │ Topbar (Titel · Live/Test · Du · …)   │
            │ (Menü)   ├───────────────────────────────────────┤
            │          │ Inhalt der gewählten Seite            │
            └──────────┴───────────────────────────────────────┘
            Die Inhalte baut JavaScript (js/main.js) – hier steht nur das Gerüst.
        -->
        <div class="shell">
            <aside class="sidebar" id="sidebar" aria-label="Hauptmenü">
                <a class="brand" href="#/">
                    <span class="brand-mark" aria-hidden="true"></span>
                    <span class="brand-name">at<span class="brand-zero">0</span>mic</span>
                    <span class="brand-sub">Cockpit</span>
                </a>
                <nav class="nav" id="nav"></nav>
                <div class="sidebar-foot">
                    <a class="nav-link subtle" href="/legacy/" target="_blank" rel="noopener">
                        <span class="nav-icon" data-icon="history"></span>
                        <span>Alte Oberfläche</span>
                    </a>
                </div>
            </aside>
            <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

            <div class="main">
                <header class="topbar" id="topbar">
                    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menü öffnen">
                        <span data-icon="menu"></span>
                    </button>
                    <div class="topbar-title">
                        <h1 id="pageTitle">…</h1>
                    </div>
                    <div class="topbar-actions">
                        <div class="mode-switch" id="modeSwitch" role="group" aria-label="Datenbank wählen" hidden>
                            <button type="button" data-mode="live">Live</button>
                            <button type="button" data-mode="test">Test</button>
                        </div>
                        <div class="identity" id="identity"></div>
                        <button class="icon-btn" id="logBtn" title="Anfragen-Protokoll" aria-label="Anfragen-Protokoll">
                            <span data-icon="activity"></span>
                            <span class="dot-count" id="logCount" hidden>0</span>
                        </button>
                        <button class="icon-btn" id="themeBtn" title="Hell / Dunkel" aria-label="Hell oder dunkel">
                            <span data-icon="theme"></span>
                        </button>
                    </div>
                </header>
                <div class="mode-banner" id="modeBanner" hidden></div>
                <main class="content" id="content" tabindex="-1"></main>
            </div>
        </div>

        <!-- Anfragen-Protokoll (rechts ausklappbar) -->
        <aside class="drawer" id="logDrawer" aria-label="Anfragen-Protokoll" hidden>
            <div class="drawer-head">
                <div>
                    <h2>Anfragen-Protokoll</h2>
                    <p class="muted small">Jede Anfrage ans Backend – mit Antwort und Dauer.</p>
                </div>
                <div class="row gap-s">
                    <button class="btn ghost small" id="logClear">Leeren</button>
                    <button class="icon-btn" id="logClose" aria-label="Schliessen"><span data-icon="x"></span></button>
                </div>
            </div>
            <div class="drawer-body" id="logList"></div>
        </aside>

        <div class="toasts" id="toasts" aria-live="polite"></div>

        <script type="module" src="/js/main.js"></script>
    </body>
</html>
