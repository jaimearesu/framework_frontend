services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atomic_frontend
    restart: unless-stopped
    env_file: 
      - .env
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Hört auf deine Hauptdomain (vindelis.com, www.vindelis.com) und die alte (at0mic.ch)
      - "traefik.http.routers.atomic-frontend.rule=Host(`vindelis.com`) || Host(`www.vindelis.com`) || Host(`at0mic.ch`) || Host(`www.at0mic.ch`)"
      - "traefik.http.routers.atomic-frontend.entrypoints=websecure"
      - "traefik.http.routers.atomic-frontend.tls.certresolver=letsencrypt"
      # Leitet an unseren Frontend-Express-Port weiter
      - "traefik.http.services.atomic-frontend.loadbalancer.server.port=3001"
      - "traefik.http.routers.atomic-frontend.service=atomic-frontend"
      # Kunden-Websites (Plan "Bauarbeiter + Bauplan-Format", Etappe 5):
      # at0mic.site und jede Subdomain (shop.at0mic.site) -> derselbe Container,
      # dort beantwortet der Bauarbeiter (site/) sie – nie das Cockpit.
      # Regel-Schreibweise für Traefik v3 (HostRegexp mit echtem Regex).
      - "traefik.http.routers.atomic-sites.rule=Host(`at0mic.site`) || HostRegexp(`^[a-z0-9-]+\\.at0mic\\.site$`)"
      - "traefik.http.routers.atomic-sites.entrypoints=websecure"
      - "traefik.http.routers.atomic-sites.service=atomic-frontend"
      # EIN Zertifikat für alle Websites (Wildcard), geholt über die Cloudflare-DNS-Prüfung
      - "traefik.http.routers.atomic-sites.tls.certresolver=letsencrypt"
      - "traefik.http.routers.atomic-sites.tls.domains[0].main=at0mic.site"
      - "traefik.http.routers.atomic-sites.tls.domains[0].sans=*.at0mic.site"
      # Dasselbe für die neue Hauptadresse vindelis.site (Umbenennung 27.10.2026).
      # Eigener Router, weil jedes Wildcard-Zertifikat seinen eigenen Router braucht.
      - "traefik.http.routers.vindelis-sites.rule=Host(`vindelis.site`) || HostRegexp(`^[a-z0-9-]+\\.vindelis\\.site$`)"
      - "traefik.http.routers.vindelis-sites.entrypoints=websecure"
      - "traefik.http.routers.vindelis-sites.service=atomic-frontend"
      - "traefik.http.routers.vindelis-sites.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vindelis-sites.tls.domains[0].main=vindelis.site"
      - "traefik.http.routers.vindelis-sites.tls.domains[0].sans=*.vindelis.site"
      # Eigene Domains der Kunden (Plan "SSF-Ausbau", D2): z.B. www.meinladen.ch kommt über
      # Cloudflare for SaaS (kunden.at0mic.site) zu uns. Diese Regel nimmt ALLE übrigen Namen
      # an – mit der tiefsten Priorität (1), damit die Regeln oben immer zuerst greifen.
      # Der Bauarbeiter fragt das Backend, ob der Name eine aktive eigene Domain ist (sonst 404).
      # Zertifikat: Das echte für die Besucher macht Cloudflare. Zwischen Cloudflare und uns
      # gilt für fremde Namen "SSL Full" (Configuration Rule) – darum reicht hier tls=true
      # mit dem Standard-Zertifikat von Traefik (kein Let's Encrypt pro Kunde nötig).
      - "traefik.http.routers.atomic-custom.rule=HostRegexp(`.+`)"
      - "traefik.http.routers.atomic-custom.priority=1"
      - "traefik.http.routers.atomic-custom.entrypoints=websecure"
      - "traefik.http.routers.atomic-custom.service=atomic-frontend"
      - "traefik.http.routers.atomic-custom.tls=true"

networks:
  proxy:
    external: true